[project]
name = "catan"
version = "0.1.0"
description = "Settlers of Catan: headless game engine, simulator and API server"
requires-python = ">=3.11"
# The engine (catan_engine) is stdlib-only. Server dependencies live in the "server" extra.
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
]

[project.scripts]
catan-sim = "catan_engine.sim.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.13",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catan_engine", "src/catan_server"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # game rules are branchy by nature
  "S311",  # random is intentional: seeded, reproducible game RNG (not for secrets)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running benchmarks (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
